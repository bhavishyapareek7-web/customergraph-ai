      aspect-ratio: 16 / 9;

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased p-4 md:p-6 flex flex-col items-center justify-center">

  <div class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">

          <p class="text-xs text-slate-400">AI Demo Video Walkthrough • Track 03: Company Brain</p>
        </div>
      </div>
      <div class="flex items-center gap-2">

    </div>

    <!-- Main 16:9 Video Player Screen -->
    <div class="relative w-full bg-black video-viewport overflow-hidden select-none flex flex-col justify-between" id="videoCanvasContainer">
      
      <!-- Video Scene Container -->
      <div id="sceneContainer" class="relative w-full h-full p-6 md:p-10 flex flex-col justify-center items-center text-center">
        <!-- Dynamic Scene Content Injected by JS -->
      </div>

      <!-- Watermark / HUD Overlay -->

        <span class="text-[11px] font-mono text-cyan-400 bg-cyan-950/80 border border-cyan-800 px-2.5 py-1 rounded">FALKORDB GRAPH ENGINE</span>
        <span class="text-[11px] font-mono text-purple-400 bg-purple-950/80 border border-purple-800 px-2.5 py-1 rounded">GPT-4o</span>
      </div>

      <!-- Subtitles / Teleprompter Bar -->

          Initializing CustomerGraph AI Demo...
        </p>
      </div>
    </div>

    <!-- Bottom Controls & Timeline -->
    <div class="bg-slate-950 px-6 py-4 border-t border-slate-800 flex flex-col gap-3">
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden cursor-pointer" onclick="seekTimeline(event)">

      <div class="flex flex-wrap items-center justify-between gap-4">

        <div class="flex items-center gap-3">

          <button onclick="restartDemo()" class="text-slate-400 hover:text-white text-sm p-1.5 transition">🔄 Restart</button>

    let currentSceneIndex = 0;
    let isPlaying = false;
    let voiceEnabled = true;
    let timer = null;
    let elapsedSeconds = 0;
    let totalDemoDuration = scenes.reduce((acc, s) => acc + s.duration, 0);

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function initPlayer() {
      document.getElementById('totalTime').innerText = formatTime(totalDemoDuration);
      renderScene(0);
    }

    function renderScene(index) {
      if (index < 0 || index >= scenes.length) return;
      currentSceneIndex = index;

      const scene = scenes[index];
      const container = document.getElementById('sceneContainer');
      container.innerHTML = scene.render();

      const narrationEl = document.getElementById('narrationText');
      narrationEl.innerText = scene.narration;

      document.querySelectorAll('.scene-btn').forEach((btn, i) => {
        if (i === index) {
          btn.className = "scene-btn text-xs px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30";
        } else {
          btn.className = "scene-btn text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 hover:text-white";
        }
      });

      if (voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(scene.narration);
        utterance.rate = 1.05;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function togglePlay() {
      if (isPlaying) {
        pauseDemo();
      } else {
        playDemo();
      }
    }

    function playDemo() {
      isPlaying = true;
      document.getElementById('playIcon').innerText = "⏸";
      document.getElementById('playLabel').innerText = "Pause";

      let remaining = scenes[currentSceneIndex].duration;
      timer = setInterval(() => {
        elapsedSeconds++;
        document.getElementById('currentTime').innerText = formatTime(elapsedSeconds);
        
        let progressPct = (elapsedSeconds / totalDemoDuration) * 100;
        document.getElementById('timelineProgress').style.width = progressPct + "%";

        remaining--;
        if (remaining <= 0) {
          if (currentSceneIndex < scenes.length - 1) {
            renderScene(currentSceneIndex + 1);
            remaining = scenes[currentSceneIndex].duration;
          } else {
            pauseDemo();
            if (isRecording) stopRecording();
          }
        }
      }, 1000);
    }

    function pauseDemo() {
      isPlaying = false;
      document.getElementById('playIcon').innerText = "▶";
      document.getElementById('playLabel').innerText = "Play";
      clearInterval(timer);
      if ('speechSynthesis' in window) window.speechSynthesis.pause();
    }

    function nextScene() {
      if (currentSceneIndex < scenes.length - 1) {
        renderScene(currentSceneIndex + 1);
      }
    }

    function prevScene() {
      if (currentSceneIndex > 0) {
        renderScene(currentSceneIndex - 1);
      }
    }

    function jumpToScene(idx) {
      renderScene(idx);
    }

    function restartDemo() {
      pauseDemo();
      elapsedSeconds = 0;
      document.getElementById('timelineProgress').style.width = "0%";
      document.getElementById('currentTime').innerText = "00:00";
      renderScene(0);
      playDemo();
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voiceLabel').innerText = voiceEnabled ? "Voice: ON" : "Voice: OFF";
      document.getElementById('voiceIcon').innerText = voiceEnabled ? "🔊" : "🔇";
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    async function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: true
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = 'CustomerGraph_AI_Demo.webm';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);
          resetRecordButton();
        };

        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordLabel').innerText = "Recording... (Click to Stop)";
        document.getElementById('btnRecord').className = "flex items-center gap-2 bg-red-600 text-white font-semibold px-3 py-1.5 rounded-lg";
        restartDemo();

      } catch (err) {
        alert("Recording cancelled or display capture not permitted.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      resetRecordButton();
    }

    function resetRecordButton() {
      isRecording = false;
      document.getElementById('recordLabel').innerText = "Record Video (.webm)";
      document.getElementById('btnRecord').className = "flex items-center gap-2 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all";
    }

    window.onload = initPlayer;
  </script>
</body>
</html>
